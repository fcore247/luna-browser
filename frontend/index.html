<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// Theme sofort setzen (vor dem ersten Zeichnen, kein Aufblitzen)
(function(){var m='auto';try{m=localStorage.getItem('fm-theme')||'auto'}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';
window.applyLunaBootTheme=function(id,dark){
 var colors={luna:[325,38],lavender:[265,42],ocean:[210,55],mint:[163,40],forest:[140,30],sand:[38,42],peach:[22,58],cherry:[350,46],arctic:[188,43],graphite:[220,5]};
 var c=colors[id]||colors.forest, root=document.documentElement;
 root.style.setProperty('--boot-bg','hsl('+c[0]+','+(dark?22:30)+'%,'+(dark?11:96)+'%)');
 root.style.setProperty('--boot-ink','hsl('+c[0]+','+c[1]+'%,'+(dark?73:38)+'%)');
};
var id='forest';try{id=localStorage.getItem('luna-color-theme')||'forest'}catch(e){}
window.applyLunaBootTheme(id,d);})();
</script>
<style>
/* Sofort sichtbar, auch bevor JavaScript und App-Daten geladen sind. */
html{background:var(--boot-bg,#f2f8f4)}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;--wails-draggable:drag;background:var(--boot-bg,#f2f8f4);color:var(--boot-ink,#44845a);transition:opacity .32s ease}

#splash.out{opacity:0;pointer-events:none}#splash.gone{display:none}
.boot-composition{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateY(-12px)}
.boot-wordmark{width:min(390px,80vw);height:auto;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.boot-wordmark path{stroke-dasharray:1;stroke-dashoffset:1;animation:bootWrite .19s linear forwards;animation-delay:var(--write-delay)}
@keyframes bootWrite{to{stroke-dashoffset:0}}
.boot-stage{position:relative;width:280px;height:150px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.boot-icon{position:absolute;left:100px;top:35px;width:80px;height:80px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:bootGlide 3.6s linear infinite;animation-delay:calc(1.75s + var(--delay))}
@keyframes bootGlide{
  0%{opacity:0;transform:translateX(130px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
  8%{opacity:1;transform:translateX(0)}
  19%{opacity:1;transform:translateX(0);animation-timing-function:cubic-bezier(.7,0,1,.35)}
  25%,100%{opacity:0;transform:translateX(-140px)}
}
@media(prefers-reduced-motion:reduce){.boot-wordmark path{animation:none;stroke-dashoffset:0}.boot-icon{animation-name:bootFade}@keyframes bootFade{0%,25%,100%{opacity:0}8%,19%{opacity:1}}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Browser wird vorbereitet" aria-busy="true">
  <div class="boot-composition">
    <svg class="boot-wordmark" viewBox="-8 0 420 96" role="img" aria-label="luna browser">
      <path transform="translate(0 0)" pathLength="1" style="--write-delay:0.12s" d="M5 65 C17 54 34 26 29 15 C24 4 15 23 14 44 C12 61 12 77 23 72 L32 64"/>
      <path transform="translate(31 0)" pathLength="1" style="--write-delay:0.25s" d="M0 64 Q9 52 12 45 L6 64 C0 81 16 76 25 48 L19 66 Q16 80 31 64"/>
      <path transform="translate(61 0)" pathLength="1" style="--write-delay:0.38s" d="M0 64 L10 45 L5 67 C13 45 29 36 25 53 L21 66 Q18 79 34 64"/>
      <path transform="translate(94 0)" pathLength="1" style="--write-delay:0.51s" d="M25 49 C13 36 -2 57 3 69 C8 81 22 62 25 47 L21 66 Q19 80 35 65"/>
      <path transform="translate(149 0)" pathLength="1" style="--write-delay:0.64s" d="M0 65 C13 53 30 23 23 14 C17 7 10 26 9 46 L6 66 C4 82 26 73 27 55 C28 42 16 44 11 54 Q20 67 36 56"/>
      <path transform="translate(184 0)" pathLength="1" style="--write-delay:0.77s" d="M0 64 L9 46 Q7 58 19 47 Q26 44 23 51 L18 65 Q15 78 29 64"/>
      <path transform="translate(213 0)" pathLength="1" style="--write-delay:0.90s" d="M25 49 C12 36 -1 55 3 67 C8 81 28 66 25 51 Q28 60 36 54"/>
      <path transform="translate(247 0)" pathLength="1" style="--write-delay:1.03s" d="M0 58 L8 46 C-1 74 5 81 16 61 L23 47 C15 76 23 80 34 62 Q43 46 36 45 Q31 46 37 55 L44 56"/>
      <path transform="translate(291 0)" pathLength="1" style="--write-delay:1.16s" d="M0 64 Q13 52 18 44 C9 52 31 64 18 72 Q8 78 5 69 Q16 75 30 64"/>
      <path transform="translate(322 0)" pathLength="1" style="--write-delay:1.29s" d="M0 64 C23 61 29 44 17 45 C3 46 -1 72 12 74 Q24 76 34 64"/>
      <path transform="translate(355 0)" pathLength="1" style="--write-delay:1.42s" d="M0 64 L9 46 Q7 58 19 47 Q26 44 23 51 L18 65 Q15 81 37 66"/>
    </svg>
  <div class="boot-stage" aria-hidden="true">
    <svg class="boot-icon" style="--delay:0s" viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="21" rx="3"/><path d="M4 12h24M9 9h.01M13 9h.01M17 9h.01M10 18h12M10 22h7"/></svg>
    <svg class="boot-icon" style="--delay:.9s" viewBox="0 0 32 32"><path d="M9 5h14a1 1 0 0 1 1 1v22l-8-5-8 5V6a1 1 0 0 1 1-1Z"/><path d="M12 11h8M12 15h5"/></svg>
    <svg class="boot-icon" style="--delay:1.8s" viewBox="0 0 32 32"><path d="M13 24V8l13-3v16M13 12l13-3"/><ellipse cx="9" cy="24" rx="4" ry="3"/><ellipse cx="22" cy="21" rx="4" ry="3"/></svg>
    <svg class="boot-icon" style="--delay:2.7s" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><ellipse cx="16" cy="16" rx="5.5" ry="12"/><path d="M4 16h24M7 9h18M7 23h18"/></svg>
  </div>
  </div>
</div>
<script>window.__browserSplashStarted = performance.now();</script>
<div id="app">
  <div id="titlebar"><div id="tabs" role="tablist" aria-label="Offene Tabs"></div></div>
  <div id="body">
    <div id="main">
      <div id="panel">
        <div id="toolbar">
          <button class="ib" id="bBack" data-act="back" aria-label="Zurück"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="ib" id="bFwd" data-act="forward" aria-label="Vor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ib" id="bReload" data-act="reload" aria-label="Neu laden"></button>
          <div id="urlbox">
            <span id="lock"></span>
            <input id="url" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Suchen oder Adresse eingeben" aria-label="Adresse">
            <button class="ib sm" id="bStar" data-act="star" aria-label="Lesezeichen"></button>
            <button class="ib sm" id="bMusicSearch" data-act="music-search-open" aria-label="Luna Music öffnen" title="Luna Music öffnen"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><g fill="none" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round"><path d="M6 9c4-1.4 8-1.1 12 1M7 12.5c3-1 6.8-.7 10 1M8 16c2.5-.7 5-.4 7.5.7"/></g></svg></button>
          </div>
          <div id="spChip"></div>
          <button class="ib" id="bSide" data-act="toggle-side" aria-label="Seitenleiste"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
          <button class="ib" id="bExtensions" data-act="extensions" aria-label="Erweiterungen" title="Erweiterungen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3h4v3a2 2 0 1 0 4 0V3h4v7h-3a2 2 0 1 0 0 4h3v7H8v-3a2 2 0 1 0-4 0v3H2v-7h3a2 2 0 1 0 0-4H2V3h6z"/></svg></button>
          <button class="ib" id="bMenu" data-act="menu" aria-label="Menü"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div id="progress"><div></div></div>
        <div id="bmbar" hidden></div>
        <div id="findbar" hidden>
          <input id="findIn" type="text" placeholder="Auf der Seite suchen" spellcheck="false" aria-label="Auf der Seite suchen">
          <span id="findStat"></span>
          <button class="ib sm" data-act="find-prev" aria-label="Vorheriger Treffer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="ib sm" data-act="find-next" aria-label="Nächster Treffer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="btn" data-act="find-close">Fertig</button>
        </div>
        <div id="page">
          <div id="start"></div>
          <div id="searchView" hidden></div>
          <div id="settingsView" hidden></div>
          <div id="chatView" hidden></div>
          <img id="pageShot" alt="" hidden>
        </div>
      </div>
    </div>
    <aside id="side" hidden aria-label="Seitenleiste"></aside>
  </div>
</div>

<div id="bm-ov" class="ovl" hidden role="dialog" aria-label="Lesezeichen"></div>
<div id="spPop" class="spPop" hidden role="dialog" aria-label="Spotify Mini-Player"><div class="pBody"></div><i class="pFl"></i><i class="pFr"></i></div>
<div id="spotify-ov" hidden role="dialog" aria-label="Spotify"></div>
<div id="sugg" hidden></div>
<div id="menu"></div>
<div id="toast" role="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
